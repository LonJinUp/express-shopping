services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://express_shop:${MYSQL_PASSWORD}@mysql:3306/express_shop
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: '1'
      SWAGGER_ENABLED: 'false'
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: express_shop
      MYSQL_USER: express_shop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
  uploads_data:
